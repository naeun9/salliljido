<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>살릴지도</title>
    <!-- Pretendard를 웹폰트로 받는다. 예전에는 CSS에서 이름만 부르고 있어서
         이 폰트가 설치된 컴퓨터에서만 제대로 보였고, 그렇지 않은 곳(맥이
         아닌 대부분의 윈도우·안드로이드)에서는 맑은 고딕 같은 시스템
         기본 글꼴로 떨어져 자간·굵기가 전부 달라 보였다. design 원본이
         쓰던 것과 같은 jsDelivr 배포본(1.3.9 동적 서브셋)이라 글자 모양은
         디자인 그대로다. 동적 서브셋이라 한글 페이지에 실제로 쓰인 글자만
         내려받는다. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
